<title>枝枝酱工作台</title>
<style>
:root{--ink:#5a1f1f;--ink2:#7a2e2e;--gold:#c9a961;--gold2:#b89752;--goldlight:#e8d4a0;--cream:#faf5f0;--cream2:#f0e6dd;--paper:#fdfaf7;--paper2:#f8f0e8;--wine:#8a3030;--rose:#c4a0a0;--txt:#2f2420;--txt2:#5a4c44;--txt3:#8a7c74;--line:rgba(201,169,97,0.28);--line2:rgba(42,37,32,0.08);--serif:'Georgia','Times New Roman','STSong','SimSun',serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;--shadow:0 12px 40px rgba(90,31,31,0.10);--shadow2:0 4px 16px rgba(90,31,31,0.08);--red:#c62828;--green:#2e7d32;}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--cream);color:var(--txt)}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
#app{display:flex;height:100vh}
.sidebar{width:264px;min-width:264px;height:100%;background:linear-gradient(180deg,#5a1f1f 0%,#7a2e2e 100%);color:var(--cream);padding:30px 20px;display:flex;flex-direction:column;box-shadow:var(--shadow);z-index:100;overflow-y:auto;transition:transform .3s}
.profile{display:flex;align-items:center;gap:13px;margin-bottom:30px;padding-bottom:24px;border-bottom:1px solid rgba(201,169,97,0.3)}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--goldlight);flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile h1{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--goldlight);letter-spacing:1px}
.profile p{font-size:10px;color:rgba(232,212,160,0.65);margin-top:3px;letter-spacing:0.5px}
.nav{list-style:none;flex:1}
.nav li{display:flex;align-items:center;padding:13px 15px;margin-bottom:5px;border-radius:12px;cursor:pointer;transition:all .25s;font-size:14px;color:rgba(250,246,237,0.75);font-weight:400;letter-spacing:0.3px}
.nav li:hover{background:rgba(201,169,97,0.14);color:var(--goldlight)}
.nav li.active{background:linear-gradient(90deg,rgba(201,169,97,0.25),rgba(201,169,97,0.06));color:var(--goldlight);border-left:3px solid var(--gold);padding-left:12px}
.nav li .ico{font-size:17px;width:22px;text-align:center;margin-right:10px}
.nav li .badge{margin-left:auto;background:var(--wine);color:var(--cream);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.nav li.active .badge{background:var(--gold);color:var(--ink)}
.theme{margin-top:16px;padding:14px;background:rgba(201,169,97,0.08);border-radius:12px;border:1px solid rgba(201,169,97,0.18)}
.theme-title{font-size:10px;color:rgba(232,212,160,0.6);margin-bottom:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.colors{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.dot:hover{transform:scale(1.12)}
.dot.active{border-color:var(--goldlight);box-shadow:0 0 0 1px var(--gold)}
.bgbtn{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(232,212,160,0.65);cursor:pointer;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,0.06);transition:background .2s;margin-top:5px}
.bgbtn:hover{background:rgba(201,169,97,0.15)}
.main{flex:1;padding:26px 32px;overflow-y:auto;min-width:0;position:relative;background:var(--cream)}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.topbar h2{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--ink);letter-spacing:-0.5px;display:flex;align-items:baseline;gap:10px}
.topbar h2 .ico{font-size:24px}
.topbar h2 small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--txt3);margin-top:4px;letter-spacing:0.2px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--paper2);border:1px solid var(--line);color:var(--gold2);font-size:11px;padding:5px 12px;border-radius:14px;font-weight:600;letter-spacing:0.3px}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.btns{display:flex;gap:9px}
.btn{border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;letter-spacing:0.2px}
.btn-pri{background:var(--ink);color:var(--goldlight)}
.btn-pri:hover{background:var(--ink2);transform:translateY(-1px)}
.btn-sec{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
.btn-sec:hover{background:var(--cream2)}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:8px}
.card{background:var(--paper);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow2);border:1px solid var(--line2)}
.card-title{font-family:var(--serif);font-size:17px;font-weight:400;display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--ink);padding-bottom:13px;border-bottom:1px solid var(--line2)}
.card-title::before{content:'';width:3px;height:17px;background:var(--gold);border-radius:2px}
.card-title .sub{font-family:var(--sans);font-size:11px;color:var(--txt3);font-weight:400;margin-left:auto;letter-spacing:0.3px}
.card-title .sub.gold{color:var(--gold2)}
.pbox{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.pcircle{width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--gold) var(--pct),var(--cream2) 0);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.pcircle::before{content:'';position:absolute;width:62px;height:62px;border-radius:50%;background:var(--paper)}
.pcircle span{position:relative;font-family:var(--serif);font-size:17px;font-weight:400;color:var(--ink)}
.pinfo{flex:1;min-width:200px}
.pinfo h4{font-size:15px;font-weight:600;margin-bottom:5px;color:var(--ink)}
.pinfo p{font-size:12px;color:var(--txt3);line-height:1.6}
.pbar{height:6px;background:var(--cream2);border-radius:3px;margin-top:10px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--goldlight));border-radius:3px;transition:width .5s}
.tlist{display:flex;flex-direction:column;gap:7px}
.task{display:flex;align-items:center;padding:14px 16px;background:var(--paper2);border-radius:10px;transition:all .2s;border:1px solid transparent}
.task:hover{border-color:var(--line);transform:translateX(2px)}
.task.done{background:rgba(201,169,97,0.08)}
.chk{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;margin-right:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:var(--paper)}
.chk.on{background:var(--gold);border-color:var(--gold)}
.chk.on::after{content:"✓";color:var(--ink);font-size:12px;font-weight:700}
.ttxt{flex:1;font-size:14px;font-weight:500;outline:none;cursor:text;color:var(--txt)}
.task.done .ttxt{color:var(--txt3);text-decoration:line-through}
.tcat{font-size:10px;color:var(--gold2);background:var(--paper2);border:1px solid var(--line);padding:2px 8px;border-radius:8px;margin-right:9px;flex-shrink:0;font-weight:500;letter-spacing:0.3px}
.tdel{background:none;border:none;color:var(--txt3);font-size:17px;cursor:pointer;padding:4px 7px;border-radius:6px;transition:all .2s}
.tdel:hover{color:var(--wine);background:rgba(138,48,48,0.08)}
.addrow{display:flex;gap:9px;margin-top:16px}
.addrow input,.addrow select{padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:13px;outline:none;background:var(--paper);font-family:var(--sans);color:var(--txt)}
.addrow input{flex:1}
.addrow input:focus,.addrow select:focus{border-color:var(--gold)}
.addrow button{background:var(--ink);color:var(--goldlight);border:none;border-radius:10px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:0.5px}
.addrow button:hover{background:var(--ink2)}
.editable{width:100%;min-height:120px;padding:16px;border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.8;outline:none;background:var(--paper2);font-family:var(--sans);color:var(--txt);resize:vertical;transition:all .2s}
.editable:focus{border-color:var(--gold);background:var(--paper)}
.editable:empty:before{content:attr(data-placeholder);color:#bbb}
.hint{font-size:11px;color:var(--txt3);margin-top:8px;display:flex;align-items:center;gap:5px;letter-spacing:0.2px;line-height:1.6}
.insp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.insp{background:var(--paper2);border-radius:12px;padding:17px;transition:all .2s;border:1px solid var(--line2)}
.insp:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--line)}
.insp .emoji{font-size:28px;margin-bottom:9px}
.insp h4{font-family:var(--serif);font-size:15px;font-weight:400;margin-bottom:7px;color:var(--ink)}
.insp p{font-size:13px;color:var(--txt2);line-height:1.75}
.insp .tag2{display:inline-block;font-size:10px;color:var(--gold2);background:var(--paper);border:1px solid var(--line);padding:3px 9px;border-radius:8px;margin-top:8px;font-weight:600;letter-spacing:0.3px}
.insp.hl{border-left:3px solid var(--gold)}
/* 视频 */
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.video-card{background:var(--paper);border-radius:14px;overflow:hidden;border:1px solid var(--line2);transition:all .2s;cursor:pointer}
.video-card:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--line)}
.video-card .cover{position:relative;height:150px;background:var(--cream2);overflow:hidden}
.video-card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.video-card .cover .dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.75);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px}
.video-card .cover .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);opacity:0;transition:opacity .2s}
.video-card:hover .cover .play{opacity:1}
.video-card .cover .play::before{content:'▶';color:#fff;font-size:32px;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.video-card .body{padding:12px 14px}
.video-card h5{font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-card .meta{font-size:11px;color:var(--txt3);display:flex;gap:10px;flex-wrap:wrap}
.video-card .meta .up{color:var(--gold2)}
/* 多平台搜索卡 */
.video-links{display:flex;flex-direction:column;gap:12px}
.search-card-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-card{border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .2s;border:1px solid var(--line2);background:var(--paper2);color:var(--ink)}
.search-card:hover{transform:translateY(-3px);box-shadow:var(--shadow2);border-color:var(--gold)}
.search-card .sc-ico{font-size:26px;margin-bottom:6px}
.search-card .sc-title{font-size:14px;font-weight:600;margin-bottom:3px}
.search-card .sc-sub{font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-card.bili{border-top:3px solid #fb7299}
.search-card.douyin{border-top:3px solid #1c1c1c}
.search-card.kuaishou{border-top:3px solid #ff5000}
.search-card.xiaohongshu{border-top:3px solid #ff2442}
.video-embed{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin-bottom:12px;background:var(--cream2)}
.video-embed iframe{width:100%;height:100%;border:0;display:block}
/* 每日精选视频 */
.daily-video{display:flex;flex-direction:column;gap:10px}
.daily-video .video-embed{margin-bottom:0;border:1px solid var(--line2)}
.dv-info{padding:4px 2px}
.dv-info h5{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink);line-height:1.5}
.dv-info .meta{font-size:12px;color:var(--txt3);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.dv-info .meta .up{color:var(--gold2)}
.dv-link{display:inline-block;font-size:12px;color:var(--gold2);text-decoration:none;border:1px solid var(--line);padding:4px 12px;border-radius:8px;transition:all .15s}
.dv-link:hover{background:var(--paper2);border-color:var(--gold)}
/* 指数 */
.index-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.index-card{background:var(--paper2);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--line2)}
.index-card .nm{font-size:12px;color:var(--txt3);margin-bottom:6px}
.index-card .val{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--ink)}
.index-card .chg{font-size:13px;font-weight:600;margin-top:3px}
.index-card .chg.up{color:var(--red)}
.index-card .chg.down{color:var(--green)}
.bigstat{text-align:center;padding:26px;background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:16px;margin-bottom:18px;color:var(--cream)}
.bigstat .num{font-family:var(--serif);font-size:48px;font-weight:400;color:var(--goldlight);line-height:1}
.bigstat .label{font-size:12px;color:rgba(250,246,237,0.6);margin-top:8px;letter-spacing:1px}
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.statitem{background:var(--paper2);border-radius:12px;padding:15px;border:1px solid var(--line2)}
.statitem .k{font-size:11px;color:var(--txt3);margin-bottom:5px;letter-spacing:0.3px}
.statitem .v{font-family:var(--serif);font-size:19px;font-weight:400;color:var(--ink)}
.statitem .v.red{color:var(--red)}
.statitem .v.green{color:var(--green)}
.statitem .v.gold{color:var(--gold2)}
.stock-list{display:flex;flex-direction:column;gap:7px}
.stock-item{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:var(--paper2);border-radius:10px;border:1px solid var(--line2);transition:all .15s}
.stock-item:hover{border-color:var(--line)}
.stock-item .name{font-size:14px;font-weight:500;color:var(--ink)}
.stock-item .code{font-family:var(--serif);font-size:11px;color:var(--txt3);margin-top:2px;letter-spacing:0.5px}
.stock-item .right{text-align:right}
.stock-item .pct{font-family:var(--serif);font-size:17px;font-weight:400}
.stock-item .pct.red{color:var(--red)}
.stock-item .pct.green{color:var(--green)}
.stock-item .info{font-size:11px;color:var(--txt3);margin-top:2px}
/* 涨停梯队 */
.zt-tier{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.zt-badge{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;cursor:default;transition:transform .15s}
.zt-badge:hover{transform:translateY(-2px)}
.zt-badge .num{font-family:var(--serif);font-size:18px;margin-right:4px}
.zt-badge.t1{background:var(--red)}
.zt-badge.t2{background:#e57373}
.zt-badge.t3{background:#ef9a9a}
.zt-badge.t4{background:#ffb74d}
.zt-badge.t5{background:#ffa726}
/* 热力图 */
.heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px}
.hcell{border-radius:8px;padding:10px 8px;text-align:center;color:#fff;font-size:12px;font-weight:500;transition:transform .15s}
.hcell:hover{transform:scale(1.04)}
.hcell.hgreen{background:var(--green)}
.hcell.hred{background:var(--red)}
.hcell .sub{font-family:var(--serif);font-size:11px;opacity:0.9;margin-top:2px}
.pred-card{background:var(--paper2);border-radius:12px;padding:16px;margin-bottom:10px;border-left:3px solid var(--gold)}
.pred-card h5{font-family:var(--serif);font-size:15px;font-weight:400;margin-bottom:7px;color:var(--ink)}
.pred-card p{font-size:12px;color:var(--txt2);line-height:1.7}
.pred-card .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pred-card .tags span{font-size:10px;background:var(--paper);border:1px solid var(--line);color:var(--gold2);padding:2px 8px;border-radius:8px;font-weight:600}
.news-item{padding:16px;background:var(--paper2);border-radius:12px;margin-bottom:10px;border-left:3px solid var(--gold);transition:all .15s}
.news-item:hover{transform:translateX(2px)}
.news-item h4{font-size:14px;font-weight:500;margin-bottom:7px;color:var(--ink);line-height:1.5}
.news-item p{font-size:13px;color:var(--txt2);line-height:1.7}
.news-item .meta{font-size:11px;color:var(--txt3);margin-top:8px;display:flex;gap:12px;letter-spacing:0.2px}
.news-item .meta .src{color:var(--gold2);font-weight:600}
.knowledge{background:var(--paper2);border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid var(--line2)}
.knowledge h5{font-family:var(--serif);font-size:15px;color:var(--gold2);font-weight:400;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.knowledge p{font-size:13px;color:var(--txt);line-height:1.8}
.knowledge .tip{margin-top:10px;padding:10px 14px;background:var(--cream2);border-radius:8px;font-size:12px;color:var(--ink);border-left:2px solid var(--gold)}
/* 情绪指标 */
.sentiment-bar{display:flex;height:40px;border-radius:10px;overflow:hidden;margin:14px 0}
.sentiment-bar .seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;transition:flex .5s}
.sentiment-bar .s-greed{background:var(--red)}
.sentiment-bar .s-neutral{background:#ffa726}
.sentiment-bar .s-fear{background:var(--green)}
.sentiment-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);margin-top:6px}
/* 穿搭 */
.outfit-hero{display:grid;grid-template-columns:1fr 1fr;gap:0;border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow);min-height:260px}
.outfit-hero-img{background-size:cover;background-position:center;min-height:260px}
.outfit-hero-text{background:linear-gradient(135deg,var(--ink),var(--ink2));padding:28px;display:flex;flex-direction:column;justify-content:center;color:var(--cream)}
.outfit-hero-text .label{font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.outfit-hero-text h3{font-family:var(--serif);font-size:24px;font-weight:400;margin-bottom:10px;color:var(--goldlight);line-height:1.3}
.outfit-hero-text p{font-size:13px;color:rgba(250,246,237,0.75);line-height:1.7}
.outfit-hero-text .palette{display:flex;gap:6px;margin-top:14px}
.outfit-hero-text .palette i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,0.2)}
.outfit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}
.outfit-card{background:var(--paper);border-radius:14px;overflow:hidden;transition:all .2s;border:1px solid var(--line2);cursor:pointer}
.outfit-card:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
.outfit-card .img{height:170px;background-size:cover;background-position:center;background-color:var(--cream2);overflow:hidden}
.outfit-card .img img{width:100%;height:100%;object-fit:cover;display:block}
.outfit-card .body{padding:11px 13px}
.outfit-card h5{font-family:var(--serif);font-size:14px;font-weight:400;margin-bottom:4px;color:var(--ink)}
.outfit-card p{font-size:11px;color:var(--txt3);line-height:1.5}
.outfit-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.outfit-card .meta .src{font-size:10px;color:var(--gold2)}
.img-loading{background:linear-gradient(90deg,var(--cream2) 25%,var(--paper2) 50%,var(--cream2) 75%);background-size:200% 100%;animation:loading 1.5s infinite}
@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* 榜单 */
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper2);border-radius:10px;border:1px solid var(--line2);transition:all .15s}
.rank-item:hover{border-color:var(--line);transform:translateX(2px)}
.rank-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;font-weight:700;flex-shrink:0}
.rank-num.top1{background:var(--gold);color:var(--ink)}
.rank-num.top2{background:#c0c0c0;color:#fff}
.rank-num.top3{background:#cd7f32;color:#fff}
.rank-num.other{background:var(--cream2);color:var(--txt3)}
.rank-info{flex:1}
.rank-info .title{font-size:13px;font-weight:500;color:var(--ink);line-height:1.4}
.rank-info .author{font-size:11px;color:var(--txt3);margin-top:2px}
.rank-info .tags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.rank-info .tags span{font-size:9px;background:var(--paper);border:1px solid var(--line);color:var(--gold2);padding:1px 6px;border-radius:6px}
.mbtn{display:none;position:fixed;top:14px;left:14px;z-index:200;width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--goldlight);border:none;box-shadow:0 4px 12px rgba(90,31,31,0.3);font-size:18px;cursor:pointer}
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--goldlight);padding:11px 22px;border-radius:24px;font-size:13px;z-index:999;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{text-align:center;padding:30px;color:var(--txt3);font-size:13px}
.loader::before{content:'◐';display:inline-block;animation:spin 1s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* 日历 */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-header h3{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--ink)}
.cal-nav{display:flex;gap:8px}
.cal-nav button{background:var(--paper2);border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;transition:all .2s}
.cal-nav button:hover{background:var(--cream2);border-color:var(--gold)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{text-align:center;font-size:11px;color:var(--txt3);padding:6px 0;font-weight:600;letter-spacing:0.5px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all .2s;background:var(--paper2);border:1px solid var(--line2);position:relative;min-height:42px}
.cal-day:hover{border-color:var(--gold);transform:scale(1.05)}
.cal-day.empty{background:transparent;border:none;cursor:default}
.cal-day.today{border:2px solid var(--gold);font-weight:700}
.cal-day.has-data{background:linear-gradient(135deg,rgba(201,169,97,0.15),rgba(201,169,97,0.05))}
.cal-day.has-data .dot-mark{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cal-day .pct-mark{font-size:9px;color:var(--gold2);font-weight:600;margin-top:1px}
.cal-day.selected{background:var(--ink);color:var(--goldlight);border-color:var(--ink)}
.cal-day.selected .pct-mark{color:var(--goldlight)}
.cal-detail{margin-top:20px}
.cal-detail-empty{text-align:center;padding:40px 20px;color:var(--txt3);font-size:14px}
.arch-section{margin-bottom:16px}
.arch-section h4{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.arch-section .arch-content{background:var(--paper2);border-radius:10px;padding:14px;font-size:13px;color:var(--txt2);line-height:1.8;border:1px solid var(--line2);white-space:pre-wrap;word-break:break-word}
.arch-tasks{display:flex;flex-direction:column;gap:5px}
.arch-task{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;background:var(--paper2);border-radius:8px}
.arch-task .chk-s{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.arch-task.done .chk-s{background:var(--gold);border-color:var(--gold)}
.arch-task.done .chk-s::after{content:'✓';color:var(--ink);font-size:10px;font-weight:700}
.arch-task.done .txt-s{text-decoration:line-through;color:var(--txt3)}
/* 建议页 */
.advice-hero{background:linear-gradient(135deg,var(--ink),var(--ink2));border-radius:16px;padding:28px;color:var(--cream);margin-bottom:18px;text-align:center}
.advice-hero .emoji{font-size:40px;margin-bottom:10px}
.advice-hero h3{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--goldlight);margin-bottom:8px}
.advice-hero p{font-size:13px;color:rgba(250,246,237,0.7);line-height:1.6}
.advice-card{background:var(--paper2);border-radius:12px;padding:18px;margin-bottom:12px;border-left:3px solid var(--gold)}
.advice-card h4{font-family:var(--serif);font-size:16px;font-weight:400;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.advice-card p{font-size:13px;color:var(--txt2);line-height:1.8}
.advice-stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.advice-stat .item{text-align:center;flex:1;min-width:80px}
.advice-stat .item .num{font-family:var(--serif);font-size:28px;font-weight:400;color:var(--gold2)}
.advice-stat .item .lbl{font-size:11px;color:var(--txt3);margin-top:3px}
.week-bar{display:flex;gap:5px;align-items:flex-end;height:80px;margin:14px 0}
.week-bar .bar{flex:1;background:linear-gradient(180deg,var(--gold),var(--goldlight));border-radius:5px 5px 0 0;min-height:4px;position:relative;transition:height .5s}
.week-bar .bar .lbl{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--txt3)}
.week-bar .bar .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--gold2);font-weight:600}
/* 反馈页 */
.fb-form{margin-bottom:18px}
.fb-form textarea{width:100%;min-height:100px;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:14px;outline:none;background:var(--paper2);font-family:var(--sans);color:var(--txt);resize:vertical;transition:all .2s;line-height:1.7}
.fb-form textarea:focus{border-color:var(--gold);background:var(--paper)}
.fb-form .fb-row{display:flex;gap:10px;margin-top:10px;align-items:center}
.fb-form select{padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:13px;outline:none;background:var(--paper);color:var(--txt)}
.fb-list{display:flex;flex-direction:column;gap:10px}
.fb-item{background:var(--paper2);border-radius:12px;padding:16px;border:1px solid var(--line2);border-left:3px solid var(--gold)}
.fb-item .fb-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fb-item .fb-date{font-size:11px;color:var(--txt3)}
.fb-item .fb-status{font-size:10px;padding:3px 9px;border-radius:8px;font-weight:600;letter-spacing:0.3px}
.fb-item .fb-status.pending{background:rgba(255,167,38,0.15);color:#e65100}
.fb-item .fb-status.adopted{background:rgba(201,169,97,0.15);color:var(--gold2)}
.fb-item .fb-status.done{background:rgba(46,125,50,0.15);color:var(--green)}
.fb-item .fb-text{font-size:13px;color:var(--txt);line-height:1.7}
.fb-item .fb-cat{font-size:10px;color:var(--gold2);background:var(--paper);border:1px solid var(--line);padding:2px 8px;border-radius:6px;margin-top:6px;display:inline-block}
.fb-empty{text-align:center;padding:40px 20px;color:var(--txt3);font-size:14px}

function init(){try{const s=localStorage.getItem(DB);if(s)Object.assign(data,JSON.parse(s));}catch(e){}if(!data.tasks||!data.tasks.length)data.tasks=defaultTasks();if(!data.notes)data.notes={};if(!data.archive)data.archive={};if(!data.feedback)data.feedback=[];const today=todayStr();if(data.lastReset&&data.lastReset!==today){archiveDay(data.lastReset);data.tasks.forEach(t=>t.completed=false);data.lastReset=today;save();}else if(!data.lastReset){data.lastReset=today;}save();setTheme(data.theme||'wine');applyBg(data.bg||'');showPage('plan');}
function save(){localStorage.setItem(DB,JSON.stringify(data));}
function archiveDay(dateStr){if(!dateStr)return;const done=data.tasks.filter(t=>t.completed).length;const total=data.tasks.length;data.archive[dateStr]={tasks:data.tasks.map(t=>({text:t.text,completed:t.completed,cat:t.cat})),done:done,total:total,pct:total?Math.round(done/total*100):0,notes:{}};Object.keys(data.notes).forEach(k=>{if(k.endsWith(dateStr)||k.indexOf(dateStr)>-1){data.archive[dateStr].notes[k]=data.notes[k];}});}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function dateStr(){const d=new Date();const w=['日','一','二','三','四','五','六'];const en=['SUN','MON','TUE','WED','THU','FRI','SAT'];return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' · '+en[d.getDay()]+' · 星期'+w[d.getDay()];}
function daySeed(){const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);}
function rand(seed){let x=Math.sin(seed++)*10000;return x-Math.floor(x);}
function pick(arr,seed){return arr[Math.floor(rand(seed)*arr.length)];}
function pickN(arr,n,seed){const c=[...arr];const out=[];for(let i=0;i<n&&c.length;i++){const idx=Math.floor(rand(seed+i)*c.length);out.push(c.splice(idx,1)[0]);}return out;}
function shuffle(arr,seed){return [...arr].sort((a,b)=>{const k1=Math.sin(seed+arr.indexOf(a))*10000;const k2=Math.sin(seed+arr.indexOf(b))*10000;return k1-k2;});}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function toggleSidebar(force){const s=document.getElementById('sidebar'),o=document.getElementById('moverlay');const open=typeof force==='boolean'?force:!s.classList.contains('open');s.classList.toggle('open',open);o.classList.toggle('show',open);}
function defaultTasks(){return[{id:1,text:'坚持吃早饭',completed:false,cat:'日常'},{id:2,text:'复盘今日股票操作',completed:false,cat:'投资'},{id:3,text:'每日单位工作',completed:false,cat:'工作'}];}
function setTheme(t){const th=themes[t];if(!th)return;data.theme=t;const s=document.documentElement.style;Object.entries(th).forEach(([k,v])=>s.setProperty('--'+k,v));s.setProperty('--line','rgba(201,169,97,0.28)');s.setProperty('--line2','rgba(42,37,32,0.08)');s.setProperty('--red','#c62828');s.setProperty('--green','#2e7d32');document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',Object.keys(themes)[i]===t));save();}
function changeBg(i){if(!i.files||!i.files[0])return;const r=new FileReader();r.onload=e=>{data.bg=e.target.result;applyBg(e.target.result);save();toast('✅ 背景图已更新！');};r.onerror=()=>toast('❌ 图片读取失败');r.readAsDataURL(i.files[0]);i.value='';}
function clearBg(){data.bg='';applyBg('');save();toast('🚫 背景已清除');}
function applyBg(u){const b=document.getElementById('bg');if(u){b.style.backgroundImage='url('+u+')';b.style.opacity='0.18';}else{b.style.backgroundImage='';b.style.opacity='0';}}
function saveNote(k,v){data.notes[k]=v;save();}
function updateBadge(){const n=data.tasks.filter(t=>!t.completed).length;const b=document.getElementById('badge');if(b)b.textContent=n;}
function showPage(p,el){document.querySelectorAll('#nav li').forEach(i=>i.classList.remove('active'));if(el)el.classList.add('active');else document.querySelector('#nav li[data-page="'+p+'"]')?.classList.add('active');document.getElementById('main').innerHTML='';if(p==='plan')renderPlan();else if(p==='novel')renderNovel();else if(p==='video')renderVideo();else if(p==='stock')renderStock();else if(p==='finance')renderFinance();else if(p==='outfit')renderOutfit();else if(p==='calendar')renderCalendar();else if(p==='advice')renderAdvice();else if(p==='feedback')renderFeedback();updateBadge();if(window.innerWidth<=820)toggleSidebar(false);}

// ===== 每日计划 =====
function renderPlan(){const done=data.tasks.filter(t=>t.completed).length,total=data.tasks.length,pct=total?Math.round(done/total*100):0;document.getElementById('main').innerHTML='<div class="topbar"><div><h2><span class="ico">📝</span>每日计划<small>'+dateStr()+' · 每日0点自动重置</small></h2></div><div class="btns"><button class="btn btn-sec btn-sm" onclick="resetTasks()">重置完成</button></div></div><div class="card"><div class="pbox"><div class="pcircle" style="--pct:'+pct+'%"><span>'+pct+'%</span></div><div class="pinfo"><h4>今日进度 · '+done+'/'+total+' 完成</h4><p>完成一项打勾，点击文字可直接编辑任务</p><div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div></div></div></div><div class="card"><div class="card-title">每日任务清单<span class="sub">'+done+'/'+total+'</span></div><div class="tlist">'+data.tasks.map(t=>'<div class="task '+(t.completed?'done':'')+'"><div class="chk '+(t.completed?'on':'')+'" onclick="toggleTask('+t.id+')"></div><span class="tcat">'+t.cat+'</span><span class="ttxt" contenteditable="true" onblur="editTask('+t.id+',this.textContent)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}">'+esc(t.text)+'</span><button class="tdel" onclick="delTask('+t.id+')">×</button></div>').join('')+'</div><div class="addrow"><input id="newTask" placeholder="添加新任务..." onkeypress="if(event.key===\'Enter\')addTask()"><select id="newCat"><option>日常</option><option>投资</option><option>工作</option><option>创作</option><option>穿搭</option><option>自定义</option></select><button onclick="addTask()">添加</button></div></div>';}
function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(t){t.completed=!t.completed;save();renderPlan();updateBadge();}}
function editTask(id,v){v=v.trim();if(!v){renderPlan();return;}const t=data.tasks.find(x=>x.id===id);if(t&&t.text!==v){t.text=v;save();toast('已保存');}}
function addTask(){const i=document.getElementById('newTask'),c=document.getElementById('newCat');const v=i.value.trim();if(!v)return;const maxId=data.tasks.reduce((m,t)=>Math.max(m,t.id),0);data.tasks.push({id:maxId+1,text:v,completed:false,cat:c.value});i.value='';save();renderPlan();toast('已添加');}
function delTask(id){if(confirm('删除这个任务？')){data.tasks=data.tasks.filter(t=>t.id!==id);save();renderPlan();toast('已删除');}}
function resetTasks(){data.tasks.forEach(t=>t.completed=false);data.lastReset=todayStr();save();renderPlan();toast('已重置');}

async function fetchRealIndex(){
 const el=document.getElementById('indexArea');
 if(!el)return;
 try{
  const url='https://qt.gtimg.cn/q=sh000001,sz399001,sz399006';
  const res=await Promise.race([fetch(url),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))]);
  const text=await res.text();
  const lines=text.split(';').filter(l=>l.trim());
  const indices=[];
  const names={'sh000001':'上证指数','sz399001':'深证成指','sz399006':'创业板指'};
  const codeMap={'sh000001':'000001','sz399001':'399001','sz399006':'399006'};
  lines.forEach(line=>{
   const m=line.match(/v_(\w+)="([^"]+)"/);
   if(m){
    const parts=m[2].split('~');
    if(parts.length>=5){
     const rawCode=codeMap[m[1]]||m[1];
     const current=parseFloat(parts[3]);
     const preClose=parseFloat(parts[4]);
     // parts[32]是涨跌幅，如果不存在就用 current-preClose 计算
     let pct=0;
     if(parts.length>32&&!isNaN(parseFloat(parts[32]))){
      pct=parseFloat(parts[32]);
     }else if(preClose&&!isNaN(preClose)&&!isNaN(current)){
      pct=(current-preClose)/preClose*100;
     }
     if(!isNaN(current)){
      indices.push({name:names[m[1]]||rawCode,current:current.toFixed(2),pct:pct.toFixed(2),up:pct>=0});
     }
    }
   }
  });
  if(indices.length){
   el.className='index-row';
   el.innerHTML=indices.map(idx=>'<div class="index-card"><div class="nm">'+idx.name+'</div><div class="val">'+idx.current+'</div><div class="chg '+(idx.up?'up':'down')+'">'+(idx.up?'▲+':'▼')+idx.pct+'%</div></div>').join('');
   return;
  }
 }catch(e){console.log('index fetch failed',e);}
 // 回退
 el.className='index-row';
 el.innerHTML='<div class="index-card"><div class="nm">上证指数</div><div class="val">--</div><div class="chg">数据获取失败</div></div><div class="index-card"><div class="nm">深证成指</div><div class="val">--</div><div class="chg">点击刷新重试</div></div><div class="index-card"><div class="nm">创业板指</div><div class="val">--</div><div class="chg">网络限制</div></div>';
}

}

// ===== 日历历史 =====
let calCurMonth=new Date();
let calSelectedDate=null;
function renderCalendar(){
 const y=calCurMonth.getFullYear(),m=calCurMonth.getMonth();
 const monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
 const firstDay=new Date(y,m,1).getDay();
 const daysInMonth=new Date(y,m+1,0).getDate();
 const today=todayStr();
 let daysHtml='';
 for(let i=0;i<firstDay;i++)daysHtml+='<div class="cal-day empty"></div>';
 for(let d=1;d<=daysInMonth;d++){
  const ds=y+'-'+(m+1)+'-'+d;
  const arch=data.archive[ds];
  const isToday=ds===today;
  const hasData=arch&&arch.total>0;
  const sel=calSelectedDate===ds;
  daysHtml+='<div class="cal-day'+(isToday?' today':'')+(hasData?' has-data':'')+(sel?' selected':'')+'" onclick="selectCalDate(\''+ds+'\')">'+d+(hasData?'<div class="pct-mark">'+arch.pct+'%</div>':'')+(hasData?'<div class="dot-mark"></div>':'')+'</div>';
 }
 document.getElementById('main').innerHTML='<div class="topbar"><div><h2><span class="ico">📅</span>日历历史<small>点击日期查看当天记录 · 自动归档</small></h2></div></div>'+
 '<div class="card"><div class="cal-header"><h3>'+y+'年 '+monthNames[m]+'</h3><div class="cal-nav"><button onclick="calPrev()">‹</button><button onclick="calToday()">今</button><button onclick="calNext()">›</button></div></div>'+
 '<div class="cal-grid"><div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>'+daysHtml+'</div></div>'+
 '<div class="card cal-detail" id="calDetail"><div class="cal-detail-empty">📋 点击上方任意日期，查看当天的任务完成情况和笔记内容</div></div>';
 if(calSelectedDate)renderCalDetail(calSelectedDate);
}
function calPrev(){calCurMonth=new Date(calCurMonth.getFullYear(),calCurMonth.getMonth()-1,1);renderCalendar();}
function calNext(){calCurMonth=new Date(calCurMonth.getFullYear(),calCurMonth.getMonth()+1,1);renderCalendar();}
function calToday(){calCurMonth=new Date();calSelectedDate=todayStr();renderCalendar();}
function selectCalDate(ds){calSelectedDate=ds;renderCalendar();}
function renderCalDetail(ds){
 const el=document.getElementById('calDetail');
 if(!el)return;
 const arch=data.archive[ds];
 const dParts=ds.split('-');
 const dt=new Date(dParts[0],dParts[1]-1,dParts[2]);
 const w=['日','一','二','三','四','五','六'];
 if(!arch){el.innerHTML='<div class="card-title">'+dParts[0]+'年'+dParts[1]+'月'+dParts[2]+'日 星期'+w[dt.getDay()]+'<span class="sub">无记录</span></div><div class="cal-detail-empty">这一天没有归档数据。只有过了0点自动重置时才会归档当天记录。</div>';return;}
 let html='<div class="card-title">'+dParts[0]+'年'+dParts[1]+'月'+dParts[2]+'日 星期'+w[dt.getDay()]+'<span class="sub gold">完成度 '+arch.pct+'% ('+arch.done+'/'+arch.total+')</span></div>';
 if(arch.tasks&&arch.tasks.length){
  html+='<div class="arch-section"><h4>📋 任务清单</h4><div class="arch-tasks">'+arch.tasks.map(t=>'<div class="arch-task '+(t.completed?'done':'')+'"><div class="chk-s"></div><span class="txt-s">'+esc(t.text)+'</span><span style="font-size:10px;color:var(--gold2);margin-left:auto">'+esc(t.cat)+'</span></div>').join('')+'</div></div>';
 }
 const noteKeys=Object.keys(arch.notes||{});
 if(noteKeys.length){
  const sectionNames={'novel':'言情灵感笔记','video':'视频脚本草稿','stock':'股票复盘','stock_review':'操作得失','stock_plan':'明日计划','outfit':'穿搭种草'};
  noteKeys.forEach(k=>{
   const name=sectionNames[k.split('_')[0]]||k;
   html+='<div class="arch-section"><h4>📝 '+esc(name)+'</h4><div class="arch-content">'+(arch.notes[k]||'(空)')+'</div></div>';
  });
 }
 el.innerHTML=html;
}

// ===== 进步建议 =====
function renderAdvice(){
 const today=todayStr();
 const dates=Object.keys(data.archive||{}).sort().reverse().slice(0,7).reverse();
 const totalDays=dates.length;
 const avgPct=totalDays?Math.round(dates.reduce((s,d)=>s+(data.archive[d].pct||0),0)/totalDays):0;
 const bestDay=dates.reduce((b,d)=>(!b||data.archive[d].pct>b.pct)?{date:d,pct:data.archive[d].pct}:b,null);
 const worstDay=dates.reduce((w,d)=>(!w||data.archive[d].pct<w.pct)?{date:d,pct:data.archive[d].pct}:w,null);
 const allNotes=dates.map(d=>Object.values(data.archive[d].notes||{}).join(' ')).join(' ');
 const trend=dates.length>=2?(data.archive[dates[dates.length-1]].pct-data.archive[dates[0]].pct):0;
 const taskCats={};
 dates.forEach(d=>data.archive[d].tasks.forEach(t=>{taskCats[t.cat]=taskCats[t.cat]||{done:0,total:0};taskCats[t.cat].total++;if(t.completed)taskCats[t.cat].done++;}));
 const bestCat=Object.entries(taskCats).sort((a,b)=>(b[1].done/b[1].total)-(a[1].done/a[1].total))[0];
 const worstCat=Object.entries(taskCats).sort((a,b)=>(a[1].done/a[1].total)-(b[1].done/b[1].total))[0];
 const noteLen=allNotes.replace(/<[^>]+>/g,'').length;
 const weekDays=['一','二','三','四','五','六','日'];
 const todayDow=new Date().getDay()||7;
 const weekBars=[];
 for(let i=0;i<7;i++){
  const dow=(todayDow-6+i+7)%7;
  const offset=todayDow-1-i;
  const d=new Date();d.setDate(d.getDate()-offset);
  const ds=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  const arch=data.archive[ds];
  weekBars.push({dow:dow===0?'日':weekDays[dow-1],pct:arch?arch.pct:0,hasData:!!arch});
 }
 let advices=[];
 if(totalDays===0){advices.push({t:'👋 开始记录吧',d:'你还没有历史数据。完成今天的任务并写下心得，明天开始就能看到进步分析了。每天0点会自动归档当天数据。'});}
 else{
  if(avgPct>=80)advices.push({t:'🎉 完成率很高',d:'过去'+totalDays+'天平均完成率 '+avgPct+'%，执行力很强！建议保持，可以尝试增加挑战性任务或提高任务数量。'});
  else if(avgPct>=50)advices.push({t:'📈 稳步前进',d:'过去'+totalDays+'天平均完成率 '+avgPct+'%。完成度中等，建议找出经常未完成的任务，分析原因（太难？时间不够？不感兴趣？），适当调整。'});
  else advices.push({t:'💪 重新出发',d:'过去'+totalDays+'天平均完成率 '+avgPct+'%。别灰心，建议从少量核心任务开始，先建立"完成"的习惯，再逐步增加任务量。'});
  if(trend>0)advices.push({t:'📊 上升趋势',d:'近期完成率比之前提高了 '+trend+'%，状态越来越好！继续保持这个节奏。'});
  else if(trend<0)advices.push({t:'⚠️ 注意下滑',d:'近期完成率比之前下降了 '+Math.abs(trend)+'%。建议回顾最近几天有什么变化（作息？心情？工作量？），及时调整。'});
  if(bestCat)advices.push({t:'🏆 最强领域',d:'「'+bestCat[0]+'」类任务完成率最高（'+Math.round(bestCat[1].done/bestCat[1].total*100)+'%），这是你的优势领域，继续保持。'});
  if(worstCat&&worstCat[0]!==bestCat[0])advices.push({t:'🔧 待提升领域',d:'「'+worstCat[0]+'」类任务完成率最低（'+Math.round(worstCat[1].done/worstCat[1].total*100)+'%），建议拆分成更小的步骤，或调整到精力最好的时段。'});
  if(noteLen>500)advices.push({t:'✍️ 善于复盘',d:'你写了大量心得笔记（'+noteLen+'字），复盘习惯很好！建议定期重读历史笔记，把经验沉淀为方法论。'});
  else if(totalDays>=3)advices.push({t:'💡 多写心得',d:'心得笔记较少（'+noteLen+'字）。复盘是进步的关键，建议每天至少写3-5句感受，记录做对了什么、哪里可以改进。'});
  if(bestDay)advices.push({t:'🌟 最佳一天',d:bestDay.date.replace(/-/g,'/')+' 完成率 '+bestDay.pct+'%，回顾那天的笔记，看看做对了什么，复制成功经验。'});
 }
 let html='<div class="topbar"><div><h2><span class="ico">🌟</span>进步建议<small>'+dateStr()+' · 基于历史数据智能分析</small></h2></div><button class="btn btn-pri btn-sm" onclick="renderAdvice();toast(\'已刷新\')">🔄 刷新分析</button></div>';
 html+='<div class="advice-hero"><div class="emoji">🌟</div><h3>'+(totalDays>0?'过去 '+totalDays+' 天进步报告':'开始你的进步之旅')+'</h3><p>'+(totalDays>0?'平均完成率 '+avgPct+'% · 心得笔记 '+noteLen+' 字':'完成今天的任务，明天开始就能看到分析')+'</p></div>';
 if(totalDays>0){
  html+='<div class="card"><div class="card-title">📊 近7天完成率趋势</div><div class="week-bar">';
  weekBars.forEach(b=>{html+='<div class="bar" style="height:'+Math.max(b.pct,5)+'%"><div class="val">'+(b.hasData?b.pct+'%':'-')+'</div><div class="lbl">'+b.dow+'</div></div>';});
  html+='</div><div style="margin-top:28px"></div></div>';
  html+='<div class="card"><div class="card-title">📈 数据概览</div><div class="advice-stat"><div class="item"><div class="num">'+totalDays+'</div><div class="lbl">记录天数</div></div><div class="item"><div class="num">'+avgPct+'%</div><div class="lbl">平均完成率</div></div><div class="item"><div class="num">'+noteLen+'</div><div class="lbl">心得字数</div></div><div class="item"><div class="num">'+Object.keys(taskCats).length+'</div><div class="lbl">任务类别</div></div></div></div>';
 }
 html+='<div class="card"><div class="card-title">🎯 个性化建议</div>';
 advices.forEach(a=>{html+='<div class="advice-card"><h4>'+a.t+'</h4><p>'+a.d+'</p></div>';});
 html+='</div>';
 html+='<div class="card"><div class="card-title">💌 本周寄语</div><div class="advice-card" style="border-left-color:var(--ink2)"><p style="font-size:15px;font-style:italic">'+getWeeklyQuote(avgPct,trend)+'</p></div></div>';
 document.getElementById('main').innerHTML=html;
}
function getWeeklyQuote(pct,trend){
 const quotes={
  high_up:['执行力爆表的一周！你正在成为更好的自己，继续冲！','优秀不是偶然，是每一天的积累。你做到了。','当完成变成习惯，成功只是时间问题。'],
  high_flat:['稳定在高位就是实力。保持节奏，你很棒！','持续优秀比偶尔爆发更难，你做到了。'],
  high_down:['虽然略有下滑，但底子还在。调整状态，下周回来！'],
  mid_up:['进步明显！从及格到优秀只差坚持，你已经上路了。','每一次完成都是在投资未来的自己，继续！'],
  mid_flat:['稳扎稳打中。找一个突破口，下周尝试提升一点点。','中间地带最考验耐心，别急，量变会到质变。'],
  mid_down:['波动很正常。回看最佳那天的笔记，找回状态。'],
  low_up:['从低谷开始回升，这本身就是一种成功！','最难的是开始，你已经开始了。'],
  low_flat:['别苛责自己。先完成一件事，建立信心，再扩展。','哪怕只完成一项，也比什么都不做强。'],
  low_down:['可能是时候重新审视任务清单了。删掉不必要的，留下最重要的。']
 };
 let key='mid_flat';
 if(pct>=70)key='high_'+(trend>5?'up':trend<-5?'down':'flat');
 else if(pct>=40)key='mid_'+(trend>5?'up':trend<-5?'down':'flat');
 else key='low_'+(trend>5?'up':trend<-5?'down':'flat');
 const arr=quotes[key]||quotes['mid_flat'];
 return arr[Math.floor(rand(daySeed())*arr.length)];
}

// ===== 意见反馈 =====

 const list=data.feedback||[];
 let html='<div class="topbar"><div><h2><span class="ico">💬</span>意见反馈<small>你的每一条意见都会让App变得更好</small></h2></div></div>';
 html+='<div class="card"><div class="card-title">📝 提交修改意见<span class="sub gold">会持续优化</span></div><div class="fb-form">';

 if(list.length===0){html+='<div class="fb-empty">还没有反馈记录。你的意见提交后会显示在这里，并标注处理状态。</div>';}
 else{
  html+='<div class="fb-list">';
  list.slice().reverse().forEach(f=>{
   const statusMap={pending:{txt:'⏳ 待处理',cls:'pending'},adopted:{txt:'✅ 已采纳',cls:'adopted'},done:{txt:'🎉 已实现',cls:'done'}};
   const st=statusMap[f.status]||statusMap.pending;
   html+='<div class="fb-item"><div class="fb-meta"><span class="fb-status '+st.cls+'">'+st.txt+'</span><span class="fb-date">'+f.date+'</span></div><div class="fb-text">'+esc(f.text)+'</div><span class="fb-cat">'+esc(f.cat)+'</span>';

   html+='</div>';
  });
  html+='</div>';
 }
 html+='</div>';
 html+='<div class="card"><div class="card-title">🔄 版本更新日志<span class="sub gold">持续迭代</span></div>';
 const versions=[
  {v:'v1.0',date:'2026-07-27',items:['初版上线：每日计划、言情灵感、视频漫剧、股票复盘、财经资讯']},
  {v:'v1.1',date:'2026-07-27',items:['新增穿搭灵感板块','轻奢复古高级感UI重设计','原创复古天使图标','Unsplash真实穿搭图片','东方财富实时财经快讯']},
  {v:'v1.2',date:'2026-07-27',items:['侧边栏改为酒红+鎏金配色','言情网文内容库大幅扩写（40+梗、12+人设、甜虐句库）','AI漫剧6步制作教程','B站视频实时搜索（网文/漫剧/财经）','新浪财经实时指数抓取','起点中文网榜单抓取','涨停梯队+市场情绪指标（游资视角）']},
  {v:'v1.3',date:'2026-07-27',items:['📅 日历历史：每日自动归档，可查看任意日期记录','🌟 进步建议：基于7天完成率和心得的智能分析','💬 意见反馈：提交意见+处理状态追踪','🔄 版本更新日志']}
 ];
 versions.reverse().forEach(v=>{html+='<div class="advice-card"><h4>'+v.v+' <span style="font-size:11px;color:var(--txt3);font-weight:400">'+v.date+'</span></h4>';v.items.forEach(it=>{html+='<p style="margin-bottom:4px">· '+it+'</p>';});html+='</div>';});

function submitFeedback(){
 const text=document.getElementById('fbText').value.trim();
 const cat=document.getElementById('fbCat').value;
 if(!text){toast('请写下你的意见');return;}
 if(!data.feedback)data.feedback=[];
 data.feedback.push({text:text,cat:cat,date:new Date().toLocaleString('zh-CN'),status:'pending',reply:''});
 save();
 toast('意见已提交，感谢！');
 renderFeedback();
}
